name: AY Inbox CLI
description: Install the ayinbox CLI, verified against the release checksums, and run one command against AY Inbox.
author: AY Inbox
branding:
  icon: inbox
  color: blue

inputs:
  command:
    description: The ayinbox command to run, without the leading "ayinbox", for example `campaign list --json`. Quotes group words; nothing is evaluated by a shell.
    required: true
  api-key:
    description: An AY Inbox API key (starts with aybox_). Pass it from a secret.
    required: true
  version:
    description: CLI release tag to install, for example v1.2.3, or `latest`.
    required: false
    default: latest
  api-url:
    description: API base URL, when it is not the hosted default.
    required: false
    default: ''

outputs:
  stdout:
    description: What the command printed on stdout. JSON when the command was asked for JSON or its output is not a terminal.
    value: ${{ steps.run.outputs.stdout }}
  exit-code:
    description: The command's exit code.
    value: ${{ steps.run.outputs.exit-code }}
  version:
    description: The CLI version that was installed.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: bash "$GITHUB_ACTION_PATH/scripts/install.sh"

    - id: run
      shell: bash
      env:
        AYINBOX_BIN: ${{ steps.install.outputs.bin }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_API_URL: ${{ inputs.api-url }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run.sh"
